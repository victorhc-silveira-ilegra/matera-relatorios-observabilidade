name: Resumo do pipeline
description: Publica status dos jobs no GitHub Summary

inputs:
  commitlint:
    required: true
  python:
    required: true
  scripts:
    required: true
  github:
    required: true
  release:
    required: true
  release_tag:
    required: false
    default: ""
  release_published:
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Publicar resumo
      shell: bash
      run: |
        {
          echo "## Resumo CI/CD"
          echo ""
          echo "| Etapa | Status |"
          echo "|-------|--------|"
          echo "| Commitlint | ${{ inputs.commitlint }} |"
          echo "| Python | ${{ inputs.python }} |"
          echo "| Scripts | ${{ inputs.scripts }} |"
          echo "| GitHub | ${{ inputs.github }} |"
          echo "| Release | ${{ inputs.release }} |"
          echo ""
          if [ "${{ inputs.release_published }}" = "true" ]; then
            echo "Tag publicada: \`${{ inputs.release_tag }}\`"
          else
            echo "Nenhuma tag nova neste push."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
